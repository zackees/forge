name: Forge Rust binary

on:
  workflow_call:
    inputs:
      source_repo: {required: true, type: string}
      source_ref: {required: true, type: string}
      tool: {required: true, type: string}
      binary: {required: true, type: string}
      version: {required: true, type: string}
      # Exact rustc release that compiles the published binary. Never a
      # floating channel: see scripts/rust_toolchain.py. Default tracks
      # zackees/soldr's rust-toolchain.toml.
      rust_toolchain: {required: false, default: "1.98.1", type: string}
      linux_x64: {required: false, default: true, type: boolean}
      linux_arm64: {required: false, default: true, type: boolean}
      linux_x64_musl: {required: false, default: true, type: boolean}
      linux_arm64_musl: {required: false, default: true, type: boolean}
      macos_x64: {required: false, default: true, type: boolean}
      macos_arm64: {required: false, default: true, type: boolean}
      windows_x64: {required: false, default: true, type: boolean}
      windows_arm64: {required: false, default: true, type: boolean}
  workflow_dispatch:
    inputs:
      source_repo: {required: true, type: string}
      source_ref: {required: true, type: string}
      tool: {required: true, type: string}
      binary: {required: true, type: string}
      version: {required: true, type: string}
      # Exact rustc release that compiles the published binary. Never a
      # floating channel: see scripts/rust_toolchain.py. Default tracks
      # zackees/soldr's rust-toolchain.toml.
      rust_toolchain: {required: false, default: "1.98.1", type: string}
      linux_x64: {required: false, default: true, type: boolean}
      linux_arm64: {required: false, default: true, type: boolean}
      linux_x64_musl: {required: false, default: true, type: boolean}
      linux_arm64_musl: {required: false, default: true, type: boolean}
      macos_x64: {required: false, default: true, type: boolean}
      macos_arm64: {required: false, default: true, type: boolean}
      windows_x64: {required: false, default: true, type: boolean}
      windows_arm64: {required: false, default: true, type: boolean}

permissions:
  contents: read

env:
  # Hard floor for every Linux -gnu binary Forge publishes. Mirrors
  # scripts/rust_matrix.py::GLIBC_FLOOR and the README requirement; the
  # container images in that matrix are what actually deliver it.
  GLIBC_FLOOR: "2.17"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          ENABLED: >-
            ${{ inputs.linux_x64 && 'linux-x64-gnu,' || '' }}${{ inputs.linux_arm64 && 'linux-arm64-gnu,' || '' }}${{ inputs.linux_x64_musl && 'linux-x64-musl,' || '' }}${{ inputs.linux_arm64_musl && 'linux-arm64-musl,' || '' }}${{ inputs.macos_x64 && 'macos-x64,' || '' }}${{ inputs.macos_arm64 && 'macos-arm64,' || '' }}${{ inputs.windows_x64 && 'windows-x64-msvc,' || '' }}${{ inputs.windows_arm64 && 'windows-arm64-msvc,' || '' }}
        run: |
          test "${{ inputs.source_ref }}" != latest
          test "${{ inputs.version }}" != latest
          test -n "${{ inputs.binary }}"
          python3 scripts/rust_toolchain.py check "${{ inputs.rust_toolchain }}"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from rust_matrix import matrix
          names = {v for v in os.environ['ENABLED'].split(',') if v}
          print('matrix=' + json.dumps({'include': matrix(names)}, separators=(',', ':')))
          PY
  build:
    needs: validate
    env:
      # RUSTUP_TOOLCHAIN outranks any rust-toolchain.toml in the source repo,
      # so the pinned compiler is the one that actually builds the binary.
      RUSTUP_TOOLCHAIN: ${{ inputs.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source
      - uses: dtolnay/rust-toolchain@master
        if: matrix.container == ''
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.libc == 'musl'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build exact binary
        if: matrix.container == ''
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustc --version | tee "${GITHUB_WORKSPACE}/rustc-version.txt"
          cargo build --locked --release --target "${{ matrix.target }}" --bin "${{ inputs.binary }}"
          mkdir -p "${GITHUB_WORKSPACE}/package"
          cp "target/${{ matrix.target }}/release/${{ inputs.binary }}${{ matrix.exe_suffix }}" "${GITHUB_WORKSPACE}/package/${{ inputs.binary }}${{ matrix.exe_suffix }}"
      # Linux -gnu lanes compile inside manylinux2014 (glibc 2.17) so the
      # published binary runs on RHEL 7+, RHEL 8 and Debian 10. Only the
      # compile is containerised — checkout already ran on the host, because
      # actions/checkout's Node 20 runtime cannot start under glibc 2.17.
      - name: Build exact binary (glibc ${{ env.GLIBC_FLOOR }} container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/source \
            -e CARGO_HOME=/work/.cargo-home \
            -e RUSTUP_HOME=/work/.rustup-home \
            -e RUSTUP_TOOLCHAIN="${RUSTUP_TOOLCHAIN}" \
            "${{ matrix.container }}" \
            bash -euo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "${RUSTUP_TOOLCHAIN}" --target "${{ matrix.target }}"
              . "$CARGO_HOME/env"
              rustc --version | tee /work/rustc-version.txt
              # The checkout is owned by the runner uid, not container root;
              # without this, build scripts that query git (cargo-binstall)
              # fail with "not within a suitable git worktree".
              git config --global --add safe.directory "*"
              cargo build --locked --release --target "${{ matrix.target }}" --bin "${{ inputs.binary }}"
              cp "target/${{ matrix.target }}/release/${{ inputs.binary }}" /work/package/${{ inputs.binary }}
            '
          sudo chown "$(id -u):$(id -g)" "package/${{ inputs.binary }}"
      # Measure the floor, never assert it. A recipe is compliant only when the
      # highest GLIBC_* version this binary imports is <= 2.17.
      - name: Verify glibc floor
        if: matrix.libc == 'glibc'
        shell: bash
        run: |
          set -euo pipefail
          binary="package/${{ inputs.binary }}"
          floor="$(readelf -V "$binary" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V -u | tail -1)"
          echo "highest glibc symbol required: ${floor:-none}"
          if [ -n "$floor" ] \
             && [ "$(printf '%s\n%s\n' "$floor" "${{ env.GLIBC_FLOOR }}" | sort -V | tail -1)" != "${{ env.GLIBC_FLOOR }}" ]; then
            echo "::error::${binary} requires glibc ${floor}, above the ${{ env.GLIBC_FLOOR }} floor" >&2
            exit 1
          fi
      - name: Native smoke and manifest
        shell: bash
        run: |
          set -euo pipefail
          package/${{ inputs.binary }}${{ matrix.exe_suffix }} --version
          python3 scripts/forge_rust.py --tool "${{ inputs.tool }}" --version "${{ inputs.version }}" --binary "${{ inputs.binary }}" --target "${{ matrix.target }}" --platform "${{ matrix.platform }}" --source-repo "${{ inputs.source_repo }}" --source-ref "${{ inputs.source_ref }}" --rust-toolchain "${{ inputs.rust_toolchain }}" --rustc-version-file rustc-version.txt --output package
      - uses: actions/upload-artifact@v4
        with:
          name: forge-rust-${{ inputs.tool }}-${{ inputs.version }}-${{ matrix.platform }}
          path: package
