name: Forge Conan package

on:
  workflow_call:
    inputs:
      recipe_repo:
        description: Git URL or owner/repo containing the Conan recipe
        required: true
        type: string
      recipe_ref:
        description: Branch, tag, or commit to build
        required: false
        default: main
        type: string
      recipe_path:
        description: Path to the recipe directory inside recipe_repo
        required: false
        default: .
        type: string
      name:
        description: Conan package name
        required: true
        type: string
      version:
        description: Conan package version
        required: true
        type: string
      build_type:
        description: Conan build type
        required: false
        default: Release
        type: string
      glibc_floor:
        description: >-
          glibc floor for Linux -gnu lanes. 2.17 (manylinux2014) is the rule;
          2.28 (manylinux_2_28) is a documented exception, see README.
        required: false
        default: "2.17"
        type: string
      conan_options:
        description: Whitespace-separated Conan options, each passed as -o (e.g. "qt/*:shared=True")
        required: false
        default: ""
        type: string
      windows_x64:
        description: Build Windows x64
        required: false
        default: true
        type: boolean
      windows_x64_gnu:
        description: Build Windows x64 GNU
        required: false
        default: false
        type: boolean
      windows_arm64:
        description: Build Windows ARM64
        required: false
        default: false
        type: boolean
      linux_x64:
        description: Build Linux x64
        required: false
        default: true
        type: boolean
      linux_arm64:
        description: Build Linux ARM64
        required: false
        default: false
        type: boolean
      linux_x64_musl:
        description: Build Linux x64 musl
        required: false
        default: false
        type: boolean
      linux_arm64_musl:
        description: Build Linux ARM64 musl
        required: false
        default: false
        type: boolean
      macos_x64:
        description: Build macOS x64
        required: false
        default: false
        type: boolean
      macos_arm64:
        description: Build macOS ARM64
        required: false
        default: true
        type: boolean

  workflow_dispatch:
    inputs:
      recipe_repo:
        description: Git URL or owner/repo containing the Conan recipe
        required: true
        type: string
      recipe_ref:
        description: Branch, tag, or commit to build
        required: false
        default: main
        type: string
      recipe_path:
        description: Path to the recipe directory inside recipe_repo
        required: false
        default: .
        type: string
      name:
        description: Conan package name
        required: true
        type: string
      version:
        description: Conan package version
        required: true
        type: string
      build_type:
        description: Conan build type
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - MinSizeRel
      glibc_floor:
        description: >-
          glibc floor for Linux -gnu lanes. 2.17 (manylinux2014) is the rule;
          2.28 (manylinux_2_28) is a documented exception, see README.
        required: false
        default: "2.17"
        type: choice
        options:
          - "2.17"
          - "2.28"
      conan_options:
        description: Whitespace-separated Conan options, each passed as -o (e.g. "qt/*:shared=True")
        required: false
        default: ""
        type: string
      windows_x64:
        description: Build Windows x64
        required: false
        default: true
        type: boolean
      windows_x64_gnu:
        description: Build Windows x64 GNU
        required: false
        default: false
        type: boolean
      windows_arm64:
        description: Build Windows ARM64
        required: false
        default: false
        type: boolean
      linux_x64:
        description: Build Linux x64
        required: false
        default: true
        type: boolean
      linux_arm64:
        description: Build Linux ARM64
        required: false
        default: false
        type: boolean
      linux_x64_musl:
        description: Build Linux x64 musl
        required: false
        default: false
        type: boolean
      linux_arm64_musl:
        description: Build Linux ARM64 musl
        required: false
        default: false
        type: boolean
      macos_x64:
        description: Build macOS x64
        required: false
        default: false
        type: boolean
      macos_arm64:
        description: Build macOS ARM64
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  # Conan is pinned so host and container lanes resolve recipes identically.
  CONAN_VERSION: "2.33.0"

jobs:
  master:
    name: Pull prebuilt packages and plan workers
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.master.outputs.matrix }}
      has_builds: ${{ steps.master.outputs.has_builds }}
    steps:
      - name: Checkout forge
        uses: actions/checkout@v4
        with:
          repository: zackees/forge
          path: forge

      - name: Checkout recipe
        shell: bash
        run: |
          repo="${{ inputs.recipe_repo }}"
          if [[ "$repo" != http://* && "$repo" != https://* && "$repo" != git@* ]]; then
            repo="https://github.com/${repo}.git"
          fi
          git clone --depth 1 --branch "${{ inputs.recipe_ref }}" "$repo" recipe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan==${CONAN_VERSION}" zstandard

      - name: Pull prebuilt packages
        id: master
        shell: bash
        env:
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          WINDOWS_X64_GNU: ${{ inputs.windows_x64_gnu }}
          WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
          LINUX_X64_MUSL: ${{ inputs.linux_x64_musl }}
          LINUX_ARM64_MUSL: ${{ inputs.linux_arm64_musl }}
          MACOS_X64: ${{ inputs.macos_x64 }}
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          GLIBC_FLOOR: ${{ inputs.glibc_floor }}
          CONAN_OPTIONS: ${{ inputs.conan_options }}
        run: |
          python forge/scripts/master_pull.py \
            --name "${{ inputs.name }}" \
            --version "${{ inputs.version }}" \
            --recipe-path "recipe/${{ inputs.recipe_path }}" \
            --build-type "${{ inputs.build_type }}"

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-prebuilt-packages
          path: forge-prebuilt/*.tar.gz
          if-no-files-found: ignore

  forge:
    name: ${{ matrix.platform }}
    needs: master
    if: ${{ needs.master.outputs.has_builds == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.master.outputs.matrix) }}

    steps:
      - name: Checkout forge
        uses: actions/checkout@v4
        with:
          repository: zackees/forge
          path: forge

      - name: Checkout recipe
        shell: bash
        run: |
          repo="${{ inputs.recipe_repo }}"
          if [[ "$repo" != http://* && "$repo" != https://* && "$repo" != git@* ]]; then
            repo="https://github.com/${repo}.git"
          fi
          git clone --depth 1 --branch "${{ inputs.recipe_ref }}" "$repo" recipe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        if: ${{ matrix.container == '' }}
        run: python -m pip install "conan==${CONAN_VERSION}" zstandard

      - name: Install managed MinGW-w64 GCC
        if: ${{ matrix.mingw == true }}
        run: >
          python forge/scripts/install_soldr_mingw.py
          --target-dir "${{ runner.temp }}/soldr-mingw"

      - name: Install musl tools
        if: ${{ matrix.libc == 'musl' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Pull or build package
        if: ${{ matrix.container == '' }}
        shell: bash
        env:
          FORGE_NAME: ${{ inputs.name }}
          FORGE_VERSION: ${{ inputs.version }}
          FORGE_RECIPE_PATH: recipe/${{ inputs.recipe_path }}
          FORGE_BUILD_TYPE: ${{ inputs.build_type }}
          FORGE_CONAN_OS: ${{ matrix.conan_os }}
          FORGE_CONAN_ARCH: ${{ matrix.conan_arch }}
          FORGE_LIBC: ${{ matrix.libc }}
          FORGE_HOST_TRIPLET: ${{ matrix.host_triplet }}
          FORGE_MINGW: ${{ matrix.mingw }}
          FORGE_CONAN_OPTIONS: ${{ inputs.conan_options }}
        run: bash forge/scripts/conan_build.sh

      # Linux -gnu lanes pull or build inside the digest-pinned manylinux
      # image for the selected glibc floor, so the package links against that
      # image's glibc, not the runner's 2.39. Only Conan runs in the container:
      # checkout and upload-artifact stay on the host because their Node 20
      # runtime cannot start under glibc 2.17.
      - name: Pull or build package (glibc ${{ matrix.glibc_floor }} container)
        if: ${{ matrix.container != '' }}
        shell: bash
        env:
          FORGE_NAME: ${{ inputs.name }}
          FORGE_VERSION: ${{ inputs.version }}
          FORGE_RECIPE_PATH: recipe/${{ inputs.recipe_path }}
          FORGE_BUILD_TYPE: ${{ inputs.build_type }}
          FORGE_CONAN_OS: ${{ matrix.conan_os }}
          FORGE_CONAN_ARCH: ${{ matrix.conan_arch }}
          FORGE_LIBC: ${{ matrix.libc }}
          FORGE_CONAN_OPTIONS: ${{ inputs.conan_options }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e CONAN_HOME=/work/.conan-home \
            -e CONAN_VERSION \
            -e FORGE_NAME -e FORGE_VERSION -e FORGE_RECIPE_PATH -e FORGE_BUILD_TYPE \
            -e FORGE_CONAN_OS -e FORGE_CONAN_ARCH -e FORGE_LIBC -e FORGE_CONAN_OPTIONS \
            -e FORGE_IN_CONTAINER=true \
            -e PYTHON=/opt/python/cp312-cp312/bin/python \
            "${{ matrix.container }}" \
            bash -euo pipefail -c '
              ldd --version | head -1
              "$PYTHON" -m pip install --root-user-action=ignore "conan==${CONAN_VERSION}" zstandard
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              conan --version
              bash forge/scripts/conan_build.sh
            '
          sudo chown -R "$(id -u):$(id -g)" forge-output

      # Measure, never assert: the highest GLIBC_* version any ELF file in the
      # package imports must not exceed the lane's floor.
      - name: Measure glibc floor
        if: ${{ matrix.libc == 'glibc' }}
        shell: bash
        run: >
          python forge/scripts/glibc_floor.py forge-output/package
          --max "${{ matrix.glibc_floor }}"
          --output forge-output/glibc-floor.txt

      - name: Validate package payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("forge-output/package")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          total_size = sum(path.stat().st_size for path in files)
          print(f"Package payload size: {total_size} bytes across {len(files)} files")

          if total_size < 10 * 1024:
              print(
                  "::warning title=Small package payload::"
                  f"forge-output/package is {total_size} bytes, below the 10240 byte minimum"
              )
              print("::group::forge-output/package directory scan (first 500 files)")
              for index, path in enumerate(files[:500], start=1):
                  relative = path.relative_to(root).as_posix()
                  print(f"{index:03d} {path.stat().st_size:10d} {relative}")
              if len(files) > 500:
                  print(f"... truncated {len(files) - 500} additional files")
              print("::endgroup::")
              sys.exit("Package payload is below the 10240 byte minimum")
          PY

      - name: Archive package
        shell: bash
        run: |
          tar -cf - -C forge-output . \
            | gzip -9 > "forge-${{ inputs.name }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ inputs.name }}-${{ inputs.version }}-${{ matrix.platform }}
          path: forge-${{ inputs.name }}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
